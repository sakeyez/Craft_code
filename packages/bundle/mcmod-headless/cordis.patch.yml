# Headless Minecraft mod-development profile layer. Apply after dsh-base and
# dsh-headless: the existing one-shot runner stays in place, while this layer
# narrows the global model-facing tool set to code-development essentials and
# adds shared Fabric/NeoForge prompt, skill, and Java LSP rows.

- id: system-prompt
  config:
    persona: >-
      You are a Minecraft mod-development coding agent powered by the {{model}} model. Your working directory is {{cwd}}. Detect whether the project uses Fabric or NeoForge and identify its pinned Minecraft toolchain before edits; only a genuinely blank project with no loader decision may use Fabric + Java + Minecraft 1.21.x as a provisional default.

- insert:
    - id: mcmod-agent
      name: '@deepseek-ai/dsh-mcmod-agent'

    - id: tool-mc-project
      name: '@deepseek-ai/dsh-tool-mc-project'

    - id: lsp
      name: '@deepseek-ai/dsh-lsp'

    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      config:
        servers:
          java:
            command: jdtls
            optional: true
            extensionToLanguage:
              .java: java

    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'

- id: skill-filesystem
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-bash
  config:
    enableRunInBackground: false

- id: tool-pwsh
  config:
    enableRunInBackground: false

# v1 keeps the existing file/search, platform shell, LSP, skill, compaction,
# permission, and session-persistence rows. The rows below remain disabled so
# the first headless Minecraft profile does not expose web retrieval,
# workflow orchestration, Ralph, general subagents, goals, todos, or jobs.
- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: subagent
  disabled: true

- id: subagent-spawn-in-process
  disabled: true

- id: subagent-fork-in-process
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-subagent-report
  disabled: true

- id: jobs
  disabled: true

- id: tool-jobs
  disabled: true

- id: goal
  disabled: true

- id: goal-round-driver
  disabled: true

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-todo
  disabled: true

- id: plan-mode
  disabled: true

- id: tool-str-replace-editor
  disabled: true
