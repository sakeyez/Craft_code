# Keyless replay includes the live `cordis.yml`, disables the key-requiring
# DeepSeek adapter, and inserts `llm-replay` to serve recorded JSONL without a key
# or network; every other app entry remains shared. It also restates the acp-agent
# config to re-pin `deepseek-v4-flash`: `cordis.yml` ships `deepseek-v4-pro`, but the
# recorded corpus (request headers, provenance, system prompt) was captured on flash,
# so replay holds the recorded model to stay reproducible without a re-record. A config
# patch replaces the whole app config, so the base fields are restated verbatim.
# With `DSH_SNAPSHOT=replay`, the app bin reads `DSH_SNAPSHOT_FILE` and optional
# `DSH_SNAPSHOT_OVERRIDE` from the harness. The one-shot patch applies at include
# load time, and stdout remains reserved for ACP JSON-RPC.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      # `name` asserts the target: a mismatch skips the patch and warns only when
      # a logger exists. A renamed id leaves a stale adapter entry, but replay still
      # short-circuits through `llm-replay`.
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          # Replay fixtures are raw JSONL; the whole-config patch must restate
          # the compression choice or the default zstd frames hide the logs
          # from the harness's harvest.
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Work efficiently on the user's requested task. Before broad exploration or edits, write a short scope definition with the requested goal, required behavior, explicit out-of-scope work, likely files or modules, acceptance checks, and uncertainties that do not block a minimal implementation. Keep it short and revise it only when new evidence changes the scope. Ask only questions whose answers materially change the result, risk, or scope.

            Research only for a concrete decision. Start with repository patterns, adjacent modules, types, compiler errors, and relevant tests. Query official API documentation or runtime source only when those sources cannot establish the needed signature or behavior, or when persistence, network, security, concurrency, process, or lifecycle effects are at risk. State the exact question before each API query and stop once the decision is supported. After a compiler or test failure, investigate only interfaces related to that failure. A user request for a deep audit overrides this default.

            Before reading, form the key file set and batch independent reads or searches when the tool protocol allows it. Do not reread unchanged files without evidence they changed or a patch or diagnostic requires it. Before writing, form the complete change list and make a small number of concentrated edits. Run the smallest relevant checks after implementation and use their real failures to guide focused fixes.

            Triage runtime concerns by probability, impact, path, existing protection, and verification cost. Prioritize high-probability, high-impact issues and direct security, data, concurrency, or lifecycle risks. Record low-probability, low-impact risks without blocking delivery when there is no trigger path.

            Keep progress updates concise: report confirmed facts, blocking uncertainties, why the next query is needed, and when exploration ends. Do not narrate every tool call, repeat "let me inspect" style updates, or reveal hidden reasoning.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - id: sandbox
        name: '@deepseek-ai/dsh-sandbox-local'
        config:
          runnerCommand:
            - bash
            - -c
            - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
            - passthrough-runner
          runnerFailureSignatures:
            - 'passthrough-runner: profile rejected'
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
          # Authored scenarios can fence a later parent action on the real
          # child settlement edge without exposing a test-only model tool.
          - id: subagent-settlement-marker
            name: './tests/fixtures/subagent-settlement-marker.ts'
