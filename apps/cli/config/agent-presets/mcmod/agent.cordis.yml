# The `mcmod` agent preset: a Fabric-first Minecraft Java mod-development
# agent over the Web host composition.
#
# This is an AGENT-PLANE composition. The host composition owns registries,
# persistence, sandboxing, approval, filesystem providers, shell executors,
# Java LSP providers, and the model route. This preset contributes the prompt
# sections and model-facing tools one Minecraft modding session receives.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a Minecraft mod-development coding agent powered by the {{model}} model. Your working directory is {{cwd}}. Identify the project's loader and pinned Minecraft toolchain before edits; when no project decision exists, use Fabric + Java + Minecraft 1.21.x as the default prototype.

- id: mcmod-agent
  name: '@deepseek-ai/dsh-mcmod-agent'

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
  config:
    enableRunInBackground: false

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── Minecraft project facts ────────────────────────────────────────────────

- id: tool-mc-project
  name: '@deepseek-ai/dsh-tool-mc-project'

# ── LSP ─────────────────────────────────────────────────────────────────────

- id: tool-lsp
  name: '@deepseek-ai/dsh-tool-lsp'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
